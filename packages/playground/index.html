<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ملعب LibreText التجريبي</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: linear-gradient(160deg, #f8fafc, #eef2f7);
      min-height: 100vh;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .page-header {
      max-width: 1200px;
      margin: 0 auto 16px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .page-header h1 {
      font-size: 20px;
      color: #0f172a;
      margin: 0;
    }
    .page-header small { color: #64748b; font-size: 13px; }
    #app {
      max-width: 1200px;
      margin: 0 auto;
      height: calc(100vh - 110px);
      min-height: 620px;
    }
    .hint {
      max-width: 1200px;
      margin: 12px auto 0;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    .hint b { color: #64748b; }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>🧪 ملعب LibreText التجريبي</h1>
    <small>PHASE-09 — محرر متعدد الطبقات بنمط ليبرا أوفيس</small>
  </header>

  <div id="app"></div>

  <p class="hint">
    جرّب: <b>التبويبات الأربعة</b> (نص/بيانات/عرض/قاعدة) •
    <b>قائمة عرض</b> لإظهار/إخفاء اللوحات • <b>⋮</b> للأدوات الفائضة •
    <b>لوحة الأوامر</b> للبحث في كل الأدوات • <b>⚙️ الإعدادات</b> لتبديل الثيمات والخلفيات •
    الخانات المتقطعة = محجوزة للمستقبل
  </p>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
